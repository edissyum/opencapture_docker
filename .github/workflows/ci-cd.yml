name: CI/CD
 
on:
  push:
    branches: [docker_claude_ci]
  pull_request:
    branches: [docker_claude_ci]
 
env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ${{ github.repository }}/frontend
  IMAGE_BACKEND: ${{ github.repository }}/backend
 
jobs:
  # ----------------------------------------------------------------
  # 1. CI - Frontend : install, lint, tests, build
  # ----------------------------------------------------------------
  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
 
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
 
  # ----------------------------------------------------------------
  # 2. CI - Backend : install et vérification basique
  # ----------------------------------------------------------------
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
 
      - name: Installer les dépendances
        run: pip install -r backend/pip-requirements.txt
 
      - name: Vérification basique d'import
        run: python -c "import sys; sys.path.insert(0, 'backend'); from wsgi import app; print('✓ wsgi:app importé avec succès')"
 
  # ----------------------------------------------------------------
  # 3. Build & push des images Docker (uniquement sur main)
  # ----------------------------------------------------------------
  build-and-push:
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: frontend
            dockerfile: ./infra/frontend.Dockerfile
            context: .
          - component: backend
            dockerfile: ./infra/backend.Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
 
      - uses: docker/setup-buildx-action@v3
 
      - name: Connexion au registry GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Métadonnées de l'image (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
 
      - name: Build et push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max